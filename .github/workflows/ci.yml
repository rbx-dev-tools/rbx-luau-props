name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The tests cover the filters; this covers the artifacts. A failure reads
      # plainly: a committed file is no longer what the vendored dump compiles
      # to, whether because it was edited or the generator moved. Both targets
      # are checked, so one cannot be refreshed while the other silently is not.
      - name: Types are current
        run: cargo run --locked -- check

      # The generated files are downloaded straight into other people's
      # projects, so they have to survive their formatter untouched. Checked
      # from a directory with no stylua.toml, because what matters is the
      # default a project that has configured nothing will run, not this
      # repository's own settings.
      - name: Generated files need no formatting
        run: |
          curl -fsSL -o stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -q stylua.zip -d "$RUNNER_TEMP/bin"
          mkdir -p "$RUNNER_TEMP/unconfigured"
          cp generated/UiProps.luau generated/StyleRuleProps.luau "$RUNNER_TEMP/unconfigured/"
          cd "$RUNNER_TEMP/unconfigured"
          "$RUNNER_TEMP/bin/stylua" --check UiProps.luau StyleRuleProps.luau
