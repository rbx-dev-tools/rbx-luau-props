name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The tests cover the filters; this covers the artifact. A failure reads
      # plainly: the committed UiProps.luau is no longer what the vendored dump
      # compiles to, whether because the file was edited or the generator moved.
      - name: Types are current
        run: cargo run --locked -- check

      # The generated file is downloaded straight into other people's projects,
      # so it has to survive their formatter untouched. Checked from a directory
      # with no stylua.toml, because what matters is the default a project that
      # has configured nothing will run, not this repository's own settings.
      - name: Generated file needs no formatting
        run: |
          curl -fsSL -o stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -q stylua.zip -d "$RUNNER_TEMP/bin"
          mkdir -p "$RUNNER_TEMP/unconfigured"
          cp generated/UiProps.luau "$RUNNER_TEMP/unconfigured/"
          cd "$RUNNER_TEMP/unconfigured"
          "$RUNNER_TEMP/bin/stylua" --check UiProps.luau
